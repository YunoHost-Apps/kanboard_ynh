packaging_format = 2

id = "kanboard"
name = "Kanboard"
description.en = "Kanban project management software"
description.fr = "Logiciel de gestion de projet Kanban"

version = "1.2.57~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://kanboard.net"
demo = "https://demo.yunohost.org/kanboard/"
admindoc = "https://docs.kanboard.org/"
code = "https://github.com/kanboard/kanboard"
fund = "https://kanboard.org/#donations"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/kanboard"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]

    [resources.sources]

        [resources.sources.main]
        url = "https://github.com/kanboard/kanboard/archive/refs/tags/v1.2.57.tar.gz"
        sha256 = "0af576021bd4ebb417cef6d187a3d10dd0d807bd668bb9dcfc6f8b40c6896e31"
        autoupdate.strategy = "latest_github_release"

    [resources.system_user]
    allow_email = true
    
    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]
    subdirs = ["cache", "files"]

    [resources.permissions]
    main.url = "/"
    ics.url = "/?controller=ICalendarController"
    ics.show_tile = false
    ics.allowed = "visitors"

    [resources.apt]
    packages = "mariadb-server, php8.5-ctype, php8.5-dom, php8.5-curl, php8.5-gd, php8.5-zip, php8.5-xml, php8.5-simplexml, php8.5-mbstring, php8.5-mysql, php8.5-ldap"

    [resources.database]
    type = "mysql"
