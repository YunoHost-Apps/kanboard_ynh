packaging_format = 2

id = "kanboard"
name = "Kanboard"
description.en = "Kanban project management software"
description.fr = "Logiciel de gestion de projet Kanban"

version = "1.2.57~ynh3"

maintainers = []

[upstream]
license = "MIT"
website = "https://kanboard.net"
demo = "https://demo.yunohost.org/kanboard/"
admindoc = "https://docs.kanboard.org/"
code = "https://github.com/kanboard/kanboard"
fund = "https://kanboard.org/#donations"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = true

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/kanboard"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.admin]
    type = "user"

[resources]

    [resources.sources]

        [resources.sources.main]
        url = "https://github.com/kanboard/kanboard/archive/refs/tags/v1.2.57.tar.gz"
        sha256 = "4f0e6d07ddf17361d2ccfa0d3910a18c3e8334816744cf1b220bff4a181fa5f4"
        autoupdate.strategy = "latest_github_release"

    [resources.system_user]
    allow_email = true
    
    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]
    subdirs = ["cache", "files"]

    [resources.permissions]
    main.url = "/"
    ics.url = "/?controller=ICalendarController"
    ics.show_tile = false
    ics.allowed = "visitors"

    [resources.apt]
    packages = "mariadb-server, php8.4-opcache, php8.4-curl, php8.4-gd, php8.4-zip, php8.4-xml, php8.4-mbstring, php8.4-mysql, php8.4-ldap, php8.4-cli, php8.4-json"

    [resources.database]
    type = "mysql"
